name: Yumeiro
options:
  bundleIdPrefix: org.yumeiro
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.46.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 的 Signing & Capabilities 里选你自己的 Team
    CODE_SIGN_STYLE: Automatic
targets:
  Yumeiro-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Resources/Assets.xcassets
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Yumeiro
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: 选择要发送给 AI 的图片
        # 自建服务器常常是 http 或自签名证书，所以允许任意网络连接
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yumeiro.app
        PRODUCT_NAME: Yumeiro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Yumeiro-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Resources/Assets.xcassets
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Yumeiro
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Resources/Yumeiro-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yumeiro.app
        PRODUCT_NAME: Yumeiro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
