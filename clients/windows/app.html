<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>Yumeiro</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data: blob:; style-src file: 'unsafe-inline'; script-src file: 'unsafe-inline'; font-src data:; media-src 'none'; connect-src 'none'">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="app-cindy.css">
</head>
<body>
<div id="wall"></div>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="nav" id="navNew"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.6v4.8M5.6 8h4.8"/></svg><span>新建对话</span></button>
      <button class="nav" id="navAuto" data-view="workspaces"><svg viewBox="0 0 16 16"><path d="M2.5 5.2 8 2.5l5.5 2.7L8 8zM2.5 8 8 10.8 13.5 8M2.5 10.8 8 13.5l5.5-2.7"/></svg><span>工作区</span></button>
      <button class="nav" data-view="market"><svg viewBox="0 0 16 16"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.2a3.5 3.5 0 0 1-7 0zM8 11.2v2.3"/></svg><span>市场</span></button>
      <button class="nav" id="navSearch"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg><span>搜索</span></button>
      <button class="nav" id="navMore" aria-expanded="false"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".7"/><circle cx="8" cy="8" r=".7"/><circle cx="12.5" cy="8" r=".7"/></svg><span>更多</span></button>
      <div class="more" id="moreBox" hidden>
        <button class="nav sub" data-view="agents"><svg viewBox="0 0 16 16"><path d="M8 2.2l1.4 3.4 3.4 1.4-3.4 1.4L8 11.8 6.6 8.4 3.2 7l3.4-1.4z"/></svg><span>智能体</span></button>
        <button class="nav sub" data-view="settings"><svg viewBox="0 0 16 16"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6"/><circle cx="10" cy="5" r="1.5"/><circle cx="6" cy="11" r="1.5"/></svg><span>设置</span></button>
        <button class="nav sub" data-view="admin" id="navAdmin" hidden><svg viewBox="0 0 16 16"><path d="M8 2 3 4v4c0 3 2.2 5 5 6 2.8-1 5-3 5-6V4z"/></svg><span>管理</span></button>
      </div>
    </div>
    <div class="sect">伙伴</div>
    <button class="buddy" id="buddy" title="和梦色开始一段新对话"><img src="build/icon.png" alt=""><span class="who"><b>梦色</b><small>开始对话</small></span></button>
    <div class="sect" id="convHead">全部对话<svg viewBox="0 0 16 16" class="chev"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></div>
    <input id="convFilter" class="filter" placeholder="搜索对话标题…" hidden>
    <div class="convs" id="convs"></div>
    <div class="me">
      <div class="avatar" id="meAvatar">?</div>
      <div class="who"><b id="meName">未登录</b><small id="meHost"></small></div>
      <button class="round" id="btnPet" title="桌宠开关" hidden>🐾</button>
      <button class="round" id="btnSettings" title="设置"><svg viewBox="0 0 16 16"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6"/><circle cx="10" cy="5" r="1.5"/><circle cx="6" cy="11" r="1.5"/></svg></button>
      <button class="round" id="btnSignOut" title="退出登录 / 切换账号"><svg viewBox="0 0 16 16"><path d="M6.5 3H3.5v10h3M9.5 5.5 12.5 8l-3 2.5M12.5 8h-7"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <div id="serviceUpdateBanner" class="service-update-banner" hidden></div>
    <section class="chat" id="chat">
      <span id="ctitle" hidden>新对话</span><span id="viewBadge" hidden>普通对话</span><button id="openWorkspace" type="button" hidden></button><button id="btnSide" type="button" hidden></button>
      <div class="scroll" id="scroll">
        <div class="hello" id="hello">
          <img src="build/icon.png" alt="">
          <h1>你好，我是 Yumeiro</h1>
          <p>你的私人 AI 工作空间。今天想一起处理什么？</p>
          <div class="sugs">
            <button data-s="帮我规划一个项目，把目标拆成清楚可执行的步骤">规划一个项目<small>把目标拆成清楚可执行的步骤</small></button>
            <button data-s="帮我理解下面这段代码，解释逻辑并找出关键部分：\n">理解一段代码<small>解释逻辑、找出关键部分</small></button>
            <button data-s="帮我整理工作重点，归纳信息并安排下一步">整理工作重点<small>归纳信息，安排下一步</small></button>
            <button data-s="我们一起想想办法：梳理这个问题，比较几种解决方案">一起想想办法<small>梳理问题，比较解法</small></button>
          </div>
        </div>
        <div id="messages"></div>
      </div>
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="att-strip" id="attStrip" aria-label="待发送的图片和文件"></div>
          <input type="file" id="attPicker" multiple hidden>
          <textarea id="prompt" rows="1" placeholder="给 Yumeiro 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="crow">
            <div class="cleft">
              <button class="round plus" id="btnPlus" type="button" title="更多操作"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
              <button class="round" id="btnAttach" type="button" title="添加图片或文件（也可以直接粘贴或拖进输入框）" aria-label="添加图片或文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
              <label class="pill" title="对话类型"><select id="targetKind"><option value="model">普通模型</option><option value="agent">智能体</option></select></label>
            </div>
            <div class="cright">
              <label class="pill model" title="对话模型 / 智能体"><select id="modelSelect"></select></label>
              <label class="pill runner" title="运行引擎"><select id="runnerSelect"></select></label>
              <label class="pill" id="wsPill" title="引擎在哪个项目里工作" hidden><select id="wsSelect"></select></label>
              <label class="pill" id="modePill" title="引擎的权限" hidden><select id="modeSelect"><option value="readonly">只读</option><option value="edit">可修改文件</option></select></label>
              <button id="send" title="发送"><svg viewBox="0 0 16 16" class="i-send"><path d="M2.5 8 13.5 2.5 10 13.5 7.8 9.2z"/></svg><span class="i-stop"></span></button>
            </div>
          </div>
        </div>
        <div class="statusline"><span id="hint"></span><span class="sl-left" id="slLeft"></span><span class="sl-right" id="slRight"></span></div>
      </div>
    </section>
    <section class="native-page" id="nativePage" hidden></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="popmenu" id="popMenu" hidden></div>
<script>window.YUMEIRO_PET_BASE = 'pet/';</script>
<script src="dialog.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
<script src="pet/pet-sense.js"></script>
<script src="pet/pet.js"></script>
</body></html>
