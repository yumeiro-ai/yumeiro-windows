# Cindy 桌面端容器 · Windows 服务器版（在 WSL2 里的 Docker 引擎上运行）。
# 和仓库根目录的 docker-compose.desktop.yml 是同一个服务，区别只有两点：
#  1. 主服务在 Windows 上原生运行，不在容器里，所以不再用 desktopnet 内部网络，而是把三个端口只发布到本机回环地址（127.0.0.1）：
#     6080 浏览器桌面（主服务反向代理）、8789 更新状态、8788 桌面端的 OpenAI 兼容接口（AI 接入里填 http://127.0.0.1:8788/v1）；
#  2. 构建上下文和挂载路径用相对本文件的位置（程序目录 = ../..）。
# 由 yumeiro-windows.ps1 docker desktop 调用：docker compose -f deploy/windows/docker-desktop.yml up -d --build desktop
services:
  desktop:
    build:
      context: ../..
      dockerfile: desktop/Dockerfile
      args:
        NODE_IMAGE: ${RUNNER_NODE_IMAGE:-node:22-slim}
        CINDY_FLAVOR: ${CINDY_FLAVOR:-global}
        CINDY_VERSION: ${CINDY_VERSION:-latest}
        CINDY_DEB_URL: ${CINDY_DEB_URL:-}
        CINDY_DEB_SHA256: ${CINDY_DEB_SHA256:-}
    restart: unless-stopped
    environment:
      CINDY_FLAVOR: ${CINDY_FLAVOR:-global}
      CINDY_AUTO_UPDATE: ${CINDY_AUTO_UPDATE:-1}
      CINDY_UPDATE_INTERVAL_HOURS: ${CINDY_UPDATE_INTERVAL_HOURS:-6}
      CINDY_DOWNLOAD_PREFIX: ${CINDY_DOWNLOAD_PREFIX:-}
    secrets: [desktop_key, vnc_password]
    # 入口用 tr 去掉 Windows 回车符再执行：脚本放在 NTFS 上，行尾可能是 CRLF
    entrypoint: ["/bin/bash", "-c", "tr -d '\r' < /opt/desktop/entrypoint.sh > /tmp/desktop-entrypoint && exec /bin/bash /tmp/desktop-entrypoint"]
    volumes:
      - desktop_home:/home/cindy
      - ../../desktop:/opt/desktop:ro
      - ../../bridge:/opt/bridge:ro
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:8788:8788"
      - "127.0.0.1:8789:8789"
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${DESKTOP_MEM_LIMIT:-1536m}
    cpus: ${DESKTOP_CPUS:-1.5}
volumes:
  desktop_home:
secrets:
  desktop_key:
    file: ${SECRETS_DIR:?需要 SECRETS_DIR（桌面端密钥所在目录）}/desktop_key
  vnc_password:
    file: ${SECRETS_DIR:?需要 SECRETS_DIR（桌面端密钥所在目录）}/vnc_password
