# 代码沙箱（可选，需要先启用 docker-compose.runner.yml）。
# 首次使用先生成沙箱令牌（install.sh 会自动做）：head -c 36 /dev/urandom | base64 | tr -d '
' > secrets/sandbox_token && chmod 644 secrets/sandbox_token
#
#  - 独立容器，跑在 internal 网络里：不能访问外网，也不能访问应用、数据库；
#  - 不挂载任何卷，只持有自己的沙箱令牌（和运行器令牌不同）：运行器把“当前工作区的文件副本”发进来，跑完把改动送回去；
#  - 非 root、丢弃全部能力、只读根文件系统，限制内存 / CPU / 进程数；
#  - 里面只有 python3 / node / bash（python 需要构建运行器镜像时 INSTALL_UV=1）。
services:
  sandbox:
    build:
      context: ./runner
      args:
        NODE_IMAGE: ${RUNNER_NODE_IMAGE:-node:22-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        INSTALL_UV: ${INSTALL_UV:-1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    environment:
      PORT: 8790
      SANDBOX_ONLY: "1"
      WORKSPACES_DIR: /tmp/unused
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox_token
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-1}
      SANDBOX_MAX_SYNC_MB: ${SANDBOX_MAX_SYNC_MB:-20}
      SANDBOX_MAX_TIMEOUT_SEC: ${SANDBOX_MAX_TIMEOUT_SEC:-120}
    secrets: [sandbox_token]   # 只挂沙箱自己的令牌；不挂运行器令牌，沙箱里的代码拿不到运行器的权限
    networks: [sandboxnet]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=${SANDBOX_TMP_SIZE:-512m}"]
    pids_limit: ${SANDBOX_PIDS_LIMIT:-128}
    mem_limit: ${SANDBOX_MEM_LIMIT:-1g}
    cpus: ${SANDBOX_CPUS:-1}
  runner:
    environment:
      SANDBOX_URL: http://sandbox:8790
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox_token
    secrets: [runner_token, sandbox_token]
    networks: [agentnet, sandboxnet]
networks:
  sandboxnet:
    internal: true
secrets:
  sandbox_token:
    file: ${SECRETS_DIR:-./secrets}/sandbox_token
