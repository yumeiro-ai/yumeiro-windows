# Cindy 桌面端容器（可选）。让官方桌面端在服务器上运行，团队服务经内网调用其“本机 Agent API”。
#  - 与 yumeiro 应用共用 desktopnet，容器内主机名 desktop；不向宿主机开放任何端口，
#    浏览器桌面由 yumeiro 应用在管理员登录后反向代理（管理设置 → 桌面端）；
#  - 非 root、丢弃全部 Linux 能力、不挂载应用密钥；桌面端的登录数据只在 desktop_home 卷里。
services:
  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
      args:
        NODE_IMAGE: ${RUNNER_NODE_IMAGE:-node:22-slim}
        CINDY_FLAVOR: ${CINDY_FLAVOR:-global}
        CINDY_VERSION: ${CINDY_VERSION:-latest}
        CINDY_DEB_URL: ${CINDY_DEB_URL:-}
        CINDY_DEB_SHA256: ${CINDY_DEB_SHA256:-}
    restart: unless-stopped
    environment:
      # global = 国际版（默认），cn = 国内版。自动更新只会换同一区域的安装包（账号区域不同，不能混用）
      CINDY_FLAVOR: ${CINDY_FLAVOR:-global}
      CINDY_AUTO_UPDATE: ${CINDY_AUTO_UPDATE:-1}
      CINDY_UPDATE_INTERVAL_HOURS: ${CINDY_UPDATE_INTERVAL_HOURS:-6}
      CINDY_DOWNLOAD_PREFIX: ${CINDY_DOWNLOAD_PREFIX:-}
    secrets: [desktop_key, vnc_password]
    # 桌面端用到的脚本从宿主机挂进来（只读）：更新 Cindy 桌面端、重建镜像、重建容器都不会丢掉这些修复。
    # 入口用 tr 去掉可能的 Windows 回车符再执行，从 Windows 上传脚本也不会再出现 “no such file or directory”。
    entrypoint: ["/bin/bash", "-c", "tr -d '\r' < /opt/desktop/entrypoint.sh > /tmp/desktop-entrypoint && exec /bin/bash /tmp/desktop-entrypoint"]
    volumes:
      - desktop_home:/home/cindy
      - ./desktop:/opt/desktop:ro
      - ./bridge:/opt/bridge:ro
    networks: [desktopnet]
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${DESKTOP_MEM_LIMIT:-1536m}
    cpus: ${DESKTOP_CPUS:-1.5}
  yumeiro:
    environment:
      DESKTOP_VIEW_URL: http://desktop:6080
      # 管理设置 → 桌面端 → 软件更新：读版本、点“立即检查更新”（桌面端容器里的更新状态服务）
      DESKTOP_STATUS_URL: http://desktop:8789
      DESKTOP_KEY_FILE: /run/secrets/desktop_key
    secrets: [desktop_key]
    networks: [default, desktopnet]
networks:
  desktopnet:
volumes:
  desktop_home:
secrets:
  desktop_key:
    file: ${SECRETS_DIR:-./secrets}/desktop_key
  vnc_password:
    file: ${SECRETS_DIR:-./secrets}/vnc_password
