<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>远程控制 · Yumeiro</title>
<style>
:root{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--line:#2c2f3d;--ink:#e8e9ee;--muted:#9a9eab;--accent:#e95164;--ok:#36a87a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer}button:hover{border-color:var(--muted)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.on{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
a{color:var(--accent)}.wrap{max-width:760px;margin:0 auto;padding:16px calc(14px + env(safe-area-inset-right)) 40px calc(14px + env(safe-area-inset-left))}
h1{font-size:20px;margin:6px 0 2px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px}.dot.on{background:var(--ok)}
pre{background:#0d0e13;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.code{font:700 30px/1.2 ui-monospace,Consolas,monospace;letter-spacing:4px;color:var(--accent)}
.err{color:#ff7b7b}.tabs button{border-radius:8px;padding:4px 10px;font-size:13px}
#viewer{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
#vbar,#vtools{display:flex;gap:6px;align-items:center;padding:6px calc(8px + env(safe-area-inset-left));background:#0d0e13;overflow-x:auto;flex:none}#vtools{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
#vbar button,#vtools button{white-space:nowrap;padding:5px 10px;font-size:13px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}#screen{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;image-rendering:auto}
#keys{display:none;gap:5px;flex-wrap:wrap;padding:6px 8px;background:#0d0e13;border-top:1px solid var(--line)}#keys.show{display:flex}#keys button{padding:4px 9px;font-size:13px}
#cursorDot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:#fff5;pointer-events:none;transform:translate(-50%,-50%);display:none}
#kb{position:fixed;left:-1000px;top:0;opacity:0;width:10px;height:10px}
.ripple{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:ymr .5s ease-out forwards}
@keyframes ymr{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.hero{display:flex;gap:14px;align-items:center}.hero img{width:88px;height:88px;flex:none;object-fit:cover;border-radius:20px;box-shadow:0 6px 20px #b04bff55}
.empty{text-align:center}.empty img{width:150px;height:150px;object-fit:cover;border-radius:28px;margin:4px auto 8px;display:block;box-shadow:0 8px 26px #b04bff55}
/* 手机触摸：更大的点击区域，工具栏换行显示而不是横向滑动 */
@media (pointer:coarse){button{min-height:42px}#vbar button,#vtools button,#keys button{min-height:40px;padding:8px 12px;font-size:14px}}
@media (max-width:640px){#vtools{flex-wrap:wrap;overflow:visible}#vtools button{flex:1 1 auto}.card .row>button{flex:1 1 auto}.hero img{width:64px;height:64px;border-radius:16px}h1{font-size:18px}}
@media (max-width:640px) and (orientation:landscape){#vtools{flex-wrap:nowrap;overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/dialog.js"></script><script src="/remote.js"></script>
</body>
</html>
